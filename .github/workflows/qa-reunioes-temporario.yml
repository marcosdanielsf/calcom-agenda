name: qa-reunioes-temporario

on:
  push:
    branches: [qa/nexus-agenda-reunioes-20261121]

permissions:
  contents: read

jobs:
  reunioes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: calendso
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d calendso"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: qa-only-nextauth-secret
      CALENDSO_ENCRYPTION_KEY: qa-only-encryption-key
      CALCOM_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - id: biome
        continue-on-error: true
        run: yarn biome check --diagnostic-level=error --max-diagnostics=200 apps/web/modules/event-types/components/EventTypeLayout.tsx apps/web/modules/event-types/views/event-types-listing-view.tsx apps/web/playwright/event-types.e2e.ts
      - run: yarn db-deploy
      - run: yarn db-seed
      - run: yarn workspace @calcom/prisma prisma generate
      - run: yarn workspace @calcom/web copy-app-store-static
      - run: NEXT_PUBLIC_IS_E2E=1 NODE_OPTIONS=--max-old-space-size=6144 yarn workspace @calcom/web exec next build
      - id: playwright
        continue-on-error: true
        run: yarn playwright test apps/web/playwright/event-types.e2e.ts --project=@calcom/web --grep "Nexus switches calendar groups|editor de reunião mantém navegação"
      - if: always()
        run: test "${{ steps.biome.outcome }}" = success -a "${{ steps.playwright.outcome }}" = success
