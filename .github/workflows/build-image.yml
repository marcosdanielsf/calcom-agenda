name: build-image
on:
  push:
    branches: [feat/socialfy-agenda]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Libera disco do runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marcosdanielsf/calcom-agenda:b3321936
            ghcr.io/marcosdanielsf/calcom-agenda:latest
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda.socialfy.me
            NEXT_PUBLIC_LICENSE_CONSENT=true
            CALCOM_TELEMETRY_DISABLED=1
            NEXTAUTH_SECRET=placeholder-build-only
            CALENDSO_ENCRYPTION_KEY=placeholder-build-only
            DATABASE_URL=postgresql://placeholder/placeholder
            MAX_OLD_SPACE_SIZE=6144
          cache-from: type=gha
          cache-to: type=gha,mode=max
