name: build-preview
on:
  push:
    branches: [feat/nexus-agenda-nativa]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/marcosdanielsf/calcom-agenda:preview-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda-preview.socialfy.me
            NEXT_PUBLIC_LICENSE_CONSENT=true
            CALCOM_TELEMETRY_DISABLED=1
            NEXTAUTH_SECRET=placeholder-build-only
            CALENDSO_ENCRYPTION_KEY=placeholder-build-only
            DATABASE_URL=postgresql://placeholder/placeholder
            MAX_OLD_SPACE_SIZE=6144
            NEXT_PUBLIC_APP_NAME=Socialfy Agenda
            NEXT_PUBLIC_COMPANY_NAME=Socialfy
            NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=suporte@socialfy.me
            NEXT_PUBLIC_DISABLE_SIGNUP=1
          cache-from: type=gha,scope=nexus-preview
          cache-to: type=gha,mode=max,scope=nexus-preview
